<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>用户管理表格 · 组件库</title>
<link rel="stylesheet" href="user-table.css"><script src="user-table.js" defer></script><script src="demo.js" defer></script>
<style>body{margin:0;background:#fff;color:#272d31;font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1240px;margin:0 auto;padding:32px 20px}h1{font-size:24px;margin:0 0 24px}.preview{padding:8px;box-sizing:border-box}.demo-status{font-size:12px;color:#687178;min-height:1.6em}</style></head>
<body><main data-user-table-demo><h1>用户管理表格</h1><div class="preview"><div class="ui-users" data-ui-users>
  <div class="ui-users__scroll" role="region" aria-label="用户管理表格，可横向滚动" tabindex="0">
    <table class="ui-users__table">
      <caption>用户管理</caption>
      <thead><tr><th scope="col">UID</th><th scope="col">姓名</th><th scope="col">邮箱或者手机号</th><th scope="col" class="ui-users__money">可用资金</th><th scope="col" class="ui-users__money">冻结资金</th><th scope="col">最后登录 IP / 时间</th><th scope="col">注册时间</th><th scope="col">操作</th></tr></thead>
      <tbody><tr><td colspan="8" class="ui-users__empty">暂无用户</td></tr></tbody>
    </table>
  </div>
</div></div><p class="demo-status" data-user-demo-status role="status">示例数据 · 操作入口可接入业务接口</p></main></body></html>
