<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多选下拉框 · 组件库</title>
<link rel="stylesheet" href="multi-select.css">
<script src="multi-select.js" defer></script>
<style>body { margin:0; background:#fff; color:#272d31; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; } main { max-width:540px; margin:0 auto; padding:32px 20px; } h1 { font-size:24px; margin:0 0 24px; } .preview { box-sizing:border-box; width:240px; max-width:100%; padding:8px; }</style></head>
<body><main><h1>多选下拉框</h1><div class="preview"><details class="ui-multi" data-ui-multi>
  <summary class="ui-multi__trigger" aria-label="选择状态"><span data-multi-summary data-placeholder="选择状态">选择状态</span><span aria-hidden="true">⌄</span></summary>
  <div class="ui-multi__panel" role="group" aria-label="可选状态">
    <label><input type="checkbox" name="statuses" value="enabled">启用</label>
    <label><input type="checkbox" name="statuses" value="disabled">停用</label>
    <label><input type="checkbox" name="statuses" value="pending">待审核</label>
  </div>
</details></div></main></body></html>
