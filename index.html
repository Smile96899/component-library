<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>组件库 · 胶囊按钮、搜索框与复制按钮</title>
  <link rel="stylesheet" href="components.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f8f6; color: #202823; font: 14px/1.6 system-ui, "Microsoft YaHei", sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 48px 24px; }
    h1 { margin: 0 0 8px; font-size: 30px; }
    h2 { margin: 0 0 20px; font-size: 20px; }
    p { color: #52645a; }
    section { margin-top: 28px; padding: 28px; border: 1px solid #dce5df; border-radius: 16px; background: #fff; }
    .demo { max-width: 388px; }
    .demo-label { display: block; margin: 20px 0 8px; font-weight: 600; }
    .notice { min-height: 24px; margin-bottom: 0; overflow-wrap: anywhere; }
    code { font-family: Consolas, monospace; }
    @media(max-width: 640px) {
      main { padding: 28px 16px; }
      section { padding: 20px; }
    }
  </style>
  <script src="components.js" defer></script>
</head>
<body>
<main>
  <h1>组件库</h1>
  <p>胶囊式圆角按钮与搜索框。输入区无内框，聚焦时只高亮外层轮廓。</p>
  <section aria-labelledby="capsule-title">
    <h2 id="capsule-title">胶囊组件</h2>
    <div class="demo">
      <button class="ui-pill-button" type="button" id="apply-button" aria-label="申请配置"><span aria-hidden="true">↗</span></button>
      <form id="search-demo" role="search">
        <label class="demo-label" for="keyword">搜索</label>
        <div class="ui-search" data-ui-search>
          <svg class="ui-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg>
          <input id="keyword" class="ui-search__input" type="text" inputmode="search" enterkeyhint="search" name="q" placeholder="搜索关键词…">
          <button class="ui-search__clear" type="button" aria-label="清除搜索词" hidden>×</button>
        </div>
      </form>
    </div>
    <p class="notice" id="demo-status" role="status">输入后按 Enter 可体验搜索提交。</p>
  </section>
  <section aria-labelledby="copy-title" id="copy-demo">
    <h2 id="copy-title">胶囊复制按钮</h2>
    <div class="demo">
      <label class="demo-label" for="copy-content">待复制内容</label>
      <div class="ui-search">
        <input class="ui-search__input" id="copy-content" type="text" value="这是一段可复制的内容" aria-label="待复制内容">
      </div>
      <button class="ui-pill-button ui-copy" style="margin-top:16px" type="button" data-ui-copy data-copy-target="copy-content" aria-label="复制内容">
        <svg class="ui-copy__icon ui-copy__idle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
        <svg class="ui-copy__icon ui-copy__done" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
      </button>
    </div>
  </section>
</main>
<script>
  document.getElementById('apply-button').addEventListener('click', () => {
    document.getElementById('demo-status').textContent = '胶囊按钮已点击（演示）。';
  });
  document.getElementById('search-demo').addEventListener('submit', (event) => {
    event.preventDefault();
    const query = document.getElementById('keyword').value.trim();
    document.getElementById('demo-status').textContent = query ? '搜索演示：' + query : '请先输入搜索关键词。';
  });
</script>
</body>
</html>
