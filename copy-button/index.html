<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>复制按钮 · 组件库</title>
<link rel="stylesheet" href="copy-button.css">
<script src="copy-button.js" defer></script>
<style>body { margin:0; background:#fff; color:#202823; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
main { max-width:540px; margin:0 auto; padding:32px 20px; }

</button></div></main></body></html>
