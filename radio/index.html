<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>单选框 · 组件库</title>
<link rel="stylesheet" href="radio.css">
<style>body { margin:0; background:#fff; color:#272d31; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; } main { max-width:540px; margin:0 auto; padding:32px 20px; } h1 { font-size:24px; margin:0 0 24px; } .preview { box-sizing:border-box; width:110px; max-width:100%; padding:8px; }</style></head>
<body><main><h1>单选框</h1><div class="preview"><div class="ui-radio-group" role="group" aria-label="选择方案">
  <label class="ui-radio"><input type="radio" name="plan" value="a" aria-label="方案 A" checked></label>
  <label class="ui-radio"><input type="radio" name="plan" value="b" aria-label="方案 B"></label>
</div></div></main></body></html>
