<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>下拉选择框 · 组件库</title>
  <link rel="stylesheet" href="dropdown-select.css">
  <style>
    body { margin:0; color:#202823; background:#fff; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:540px; margin:0 auto; padding:32px 20px; }
    h1 { font-size:24px; margin:0 0 24px; }
    .preview { width:fit-content; max-width:100%; padding:8px; box-sizing:border-box; }
    .status { color:#52645a; min-height:1.6em; }
  </style>
</head>
<body>
  <main>
    <h1>下拉选择框</h1>
    <div class="preview">
      <div class="ui-select">
        <select class="ui-select__control" name="status" id="status-select" aria-label="选择状态">
          <option value="all">全部状态</option>
          <option value="enabled">启用</option>
          <option value="disabled">停用</option>
          <option value="pending">待审核</option>
        </select>
        <svg class="ui-select__arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </div>
    </div>
    <p class="status" id="selection-status" role="status">当前选择：全部状态</p>
  </main>
  <script>
    document.getElementById('status-select').addEventListener('change', event => {
      document.getElementById('selection-status').textContent = '当前选择：' + event.target.selectedOptions[0].textContent;
    });
  </script>
</body>
</html>
