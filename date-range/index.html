<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>手动日期范围 · 组件库</title>
  <link rel="stylesheet" href="date-range.css">
  <script src="date-range.js" defer></script>
  <style>
    body { margin:0; background:#fff; color:#272d31; font:14px/1.6 system-ui,"Microsoft YaHei",sans-serif; }
    main { max-width:540px; margin:0 auto; padding:32px 20px; }
    h1 { margin:0 0 24px; font-size:24px; }
    .preview { max-width:436px; padding:8px; box-sizing:border-box; }
    .demo-status { color:#656d73; min-height:1.6em; }
  </style>
</head>
<body><main>
  <h1>手动日期范围</h1>
  <form id="date-demo">
    <div class="preview">
      <div class="ui-date-range" data-ui-date-range>
        <div class="ui-date-range__row">
          <label class="ui-date-range__field"><span class="ui-date-range__label">开始日期</span><input class="ui-date-range__input" type="text" name="start_date" data-date-start placeholder="YYYY-MM-DD" value="2026-11-01" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="10"></label>
          <span class="ui-date-range__separator" aria-hidden="true">至</span>
          <label class="ui-date-range__field"><span class="ui-date-range__label">结束日期</span><input class="ui-date-range__input" type="text" name="end_date" data-date-end placeholder="YYYY-MM-DD" value="2026-11-30" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="10"></label>
        </div>
        <p class="ui-date-range__error" role="status"></p>
      </div>
    </div>
  </form>
  <p class="demo-status">手动输入 YYYY-MM-DD 或 YYYYMMDD，离开输入框后自动整理格式。</p>
</main>
<script>document.getElementById('date-demo').addEventListener('submit', event => event.preventDefault());</script>
</body></html>
